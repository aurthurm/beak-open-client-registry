version: '3'

services:

  opencr:
    container_name: opencr
    image: client-registry-opencr:latest
    build:
      context: .
      dockerfile: docker/opencr/Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - fhir
      - opensearch
    restart: always
    environment:
      - NODE_ENV=cicd
      - HAPI_FHIR_URL=http://fhir:8080/fhir/metadata
    # networks:
    #   - opencr

  opencrold:
    container_name: opencrold
    image: client-registry-opencr:old
    build:
      context: .
      dockerfile: docker/opencr/Dockerfile.old
    ports:
      - "3002:3000"
    depends_on:
      - fhir
      - opensearch
    restart: always
    environment:
      - NODE_ENV=cicd
      - HAPI_FHIR_URL=http://fhir:8080/fhir/metadata
    # networks:
    #   - opencr

  fhir:
    container_name: hapi-fhir-cr
    image: hapiproject/hapi:v5.1.0
    ports:
      - "8081:8080"
    # networks:
    #   - opencr

  opensearch:
    container_name: opensearch
    image: intrahealth/opensearch:latest
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - data01:/usr/share/opensearch/data
      
    ports:
      - 9201:9200
      - 9601:9600
    # networks:
    #   - opencr


volumes:
  data01:
    driver: local

# networks:
#   opencr:
#     driver: bridge
